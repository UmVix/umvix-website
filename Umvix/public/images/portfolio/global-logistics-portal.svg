<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Global logistics supply chain portal">
  <defs>
    <linearGradient id="gl-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="gl-panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#131418"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="gl-red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <radialGradient id="gl-glow" cx="0.5" cy="0.4" r="0.55">
      <stop stop-color="#ff1f3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl-node" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#gl-bg)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="800" height="34" fill="#101013"/>
  <circle cx="22" cy="17" r="5" fill="#ff5f57"/><circle cx="42" cy="17" r="5" fill="#febc2e"/><circle cx="62" cy="17" r="5" fill="#28c840"/>
  <rect x="300" y="10" width="220" height="14" rx="7" fill="#1c1c21"/>
  <text x="410" y="21" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74" text-anchor="middle">portal.globallogistics.com/live</text>

  <!-- header -->
  <text x="24" y="66" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#f5f5f7">Live Shipment Network</text>
  <text x="24" y="84" font-family="Arial, sans-serif" font-size="10" fill="#6b6b74">2,481 active shipments across 46 countries</text>
  <g>
    <rect x="640" y="52" width="140" height="30" rx="8" fill="#131318" stroke="#22222a"/>
    <circle cx="658" cy="67" r="4" fill="#34d399"/>
    <text x="670" y="71" font-family="Arial, sans-serif" font-size="10" fill="#b5b5bd">All systems normal</text>
  </g>

  <!-- map panel -->
  <g filter="url(#gl-shadow)">
    <rect x="24" y="100" width="512" height="326" rx="14" fill="url(#gl-panel)" stroke="#1e1e26"/>
  </g>
  <circle cx="300" cy="250" r="230" fill="url(#gl-glow)"/>
  <!-- lat/long grid -->
  <g stroke="#191921" stroke-width="1">
    <line x1="24" y1="163" x2="536" y2="163"/><line x1="24" y1="226" x2="536" y2="226"/>
    <line x1="24" y1="289" x2="536" y2="289"/><line x1="24" y1="352" x2="536" y2="352"/>
    <line x1="110" y1="100" x2="110" y2="426"/><line x1="196" y1="100" x2="196" y2="426"/>
    <line x1="282" y1="100" x2="282" y2="426"/><line x1="368" y1="100" x2="368" y2="426"/>
    <line x1="454" y1="100" x2="454" y2="426"/>
  </g>

  <!-- stylised continents (dotted) -->
  <g fill="#232630">
    <path d="M70 150 q40 -18 80 -6 q26 8 20 34 q-8 30 -50 30 q-56 2 -60 -28 q-2 -22 10 -30 Z"/>
    <path d="M120 240 q18 -6 30 8 q14 22 -2 60 q-14 30 -30 24 q-16 -8 -14 -50 q2 -34 16 -42 Z"/>
    <path d="M250 130 q60 -20 120 -4 q30 10 24 40 q-10 34 -70 30 q-80 -4 -84 -34 q-2 -22 10 -32 Z"/>
    <path d="M300 240 q40 -10 60 14 q20 30 -6 70 q-20 26 -44 14 q-20 -12 -18 -60 q2 -36 8 -52 Z"/>
    <path d="M430 160 q40 -12 60 10 q18 24 -6 48 q-24 22 -52 8 q-22 -14 -18 -44 q2 -18 16 -22 Z"/>
  </g>

  <!-- routes (arcs) -->
  <g stroke="#ff1f3d" stroke-width="1.6" fill="none" stroke-dasharray="4 4" opacity="0.85">
    <path d="M120 180 Q220 100 300 170"/>
    <path d="M300 170 Q400 120 470 200"/>
    <path d="M300 170 Q260 280 150 300"/>
    <path d="M470 200 Q380 300 330 320"/>
  </g>
  <!-- hub nodes -->
  <g>
    <circle cx="120" cy="180" r="16" fill="url(#gl-node)"/><circle cx="120" cy="180" r="4" fill="#ff1f3d"/>
    <circle cx="300" cy="170" r="18" fill="url(#gl-node)"/><circle cx="300" cy="170" r="5" fill="#fff"/><circle cx="300" cy="170" r="5" fill="#ff1f3d" fill-opacity="0.6"/>
    <circle cx="470" cy="200" r="16" fill="url(#gl-node)"/><circle cx="470" cy="200" r="4" fill="#ff1f3d"/>
    <circle cx="150" cy="300" r="14" fill="url(#gl-node)"/><circle cx="150" cy="300" r="4" fill="#ff1f3d"/>
    <circle cx="330" cy="320" r="14" fill="url(#gl-node)"/><circle cx="330" cy="320" r="4" fill="#ff1f3d"/>
  </g>
  <!-- moving pin -->
  <g transform="translate(360,145)">
    <path d="M0 0 C-9 0 -14 7 -14 14 C-14 24 0 34 0 34 C0 34 14 24 14 14 C14 7 9 0 0 0 Z" fill="url(#gl-red)"/>
    <circle cx="0" cy="14" r="5" fill="#0c0d10"/>
  </g>

  <!-- side: shipment cards -->
  <g filter="url(#gl-shadow)">
    <rect x="552" y="100" width="228" height="100" rx="12" fill="url(#gl-panel)" stroke="#1e1e26"/>
    <rect x="552" y="212" width="228" height="100" rx="12" fill="url(#gl-panel)" stroke="#1e1e26"/>
    <rect x="552" y="324" width="228" height="102" rx="12" fill="url(#gl-panel)" stroke="#1e1e26"/>
  </g>

  <!-- card 1 -->
  <text x="570" y="124" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#f5f5f7">#SHP-2291</text>
  <rect x="700" y="112" width="64" height="18" rx="9" fill="#34d39922"/><text x="732" y="125" font-family="Arial, sans-serif" font-size="8" fill="#34d399" text-anchor="middle">In transit</text>
  <text x="570" y="144" font-family="Arial, sans-serif" font-size="9" fill="#8a8a92">Shanghai → Rotterdam</text>
  <line x1="570" y1="160" x2="764" y2="160" stroke="#22222a"/>
  <line x1="570" y1="160" x2="700" y2="160" stroke="#ff1f3d" stroke-width="2"/>
  <text x="570" y="184" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74">ETA 3 days · 68% complete</text>

  <!-- card 2 -->
  <text x="570" y="236" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#f5f5f7">#SHP-2288</text>
  <rect x="700" y="224" width="64" height="18" rx="9" fill="#fbbf2422"/><text x="732" y="237" font-family="Arial, sans-serif" font-size="8" fill="#fbbf24" text-anchor="middle">Customs</text>
  <text x="570" y="256" font-family="Arial, sans-serif" font-size="9" fill="#8a8a92">Los Angeles → Tokyo</text>
  <line x1="570" y1="272" x2="764" y2="272" stroke="#22222a"/>
  <line x1="570" y1="272" x2="640" y2="272" stroke="#fbbf24" stroke-width="2"/>
  <text x="570" y="296" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74">ETA 6 days · 34% complete</text>

  <!-- card 3 -->
  <text x="570" y="348" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#f5f5f7">#SHP-2280</text>
  <rect x="700" y="336" width="64" height="18" rx="9" fill="#34d39922"/><text x="732" y="349" font-family="Arial, sans-serif" font-size="8" fill="#34d399" text-anchor="middle">Delivered</text>
  <text x="570" y="368" font-family="Arial, sans-serif" font-size="9" fill="#8a8a92">Hamburg → New York</text>
  <line x1="570" y1="384" x2="764" y2="384" stroke="#22222a"/>
  <line x1="570" y1="384" x2="764" y2="384" stroke="#34d399" stroke-width="2"/>
  <text x="570" y="408" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74">Signed · on time</text>
</svg>
