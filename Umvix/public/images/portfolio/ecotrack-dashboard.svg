<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EcoTrack sustainability analytics dashboard">
  <defs>
    <linearGradient id="eco-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="eco-panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141417"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="eco-red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="eco-area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff1f3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eco-emerald" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eco-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ff1f3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="eco-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#eco-bg)"/>
  <circle cx="640" cy="90" r="230" fill="url(#eco-glow)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="800" height="34" fill="#101013"/>
  <circle cx="22" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="5" fill="#febc2e"/>
  <circle cx="62" cy="17" r="5" fill="#28c840"/>
  <rect x="300" y="10" width="200" height="14" rx="7" fill="#1c1c21"/>
  <text x="400" y="21" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74" text-anchor="middle">app.ecotrack.io/dashboard</text>

  <!-- sidebar -->
  <rect x="0" y="34" width="150" height="416" fill="#0a0a0c"/>
  <rect x="20" y="56" width="26" height="26" rx="7" fill="url(#eco-red)"/>
  <text x="56" y="74" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#f5f5f7">EcoTrack</text>
  <rect x="18" y="104" width="114" height="30" rx="8" fill="#1a1a1f"/>
  <rect x="30" y="114" width="12" height="10" rx="2" fill="#ff1f3d"/>
  <rect x="52" y="114" width="60" height="10" rx="5" fill="#3a3a42"/>
  <g fill="#26262c">
    <rect x="30" y="150" width="12" height="10" rx="2"/><rect x="52" y="150" width="70" height="10" rx="5"/>
    <rect x="30" y="184" width="12" height="10" rx="2"/><rect x="52" y="184" width="54" height="10" rx="5"/>
    <rect x="30" y="218" width="12" height="10" rx="2"/><rect x="52" y="218" width="66" height="10" rx="5"/>
    <rect x="30" y="252" width="12" height="10" rx="2"/><rect x="52" y="252" width="48" height="10" rx="5"/>
  </g>

  <!-- header -->
  <text x="176" y="72" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#f5f5f7">Sustainability Overview</text>
  <text x="176" y="90" font-family="Arial, sans-serif" font-size="10" fill="#6b6b74">Real-time emissions &amp; energy monitoring</text>
  <rect x="690" y="52" width="92" height="30" rx="8" fill="url(#eco-red)" filter="url(#eco-shadow)"/>
  <text x="736" y="71" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#fff" text-anchor="middle">Export</text>

  <!-- KPI cards -->
  <g filter="url(#eco-shadow)">
    <rect x="176" y="104" width="140" height="72" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
    <rect x="330" y="104" width="140" height="72" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
    <rect x="484" y="104" width="140" height="72" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
    <rect x="638" y="104" width="144" height="72" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
  </g>
  <text x="192" y="128" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">CO₂ Saved</text>
  <text x="192" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#f5f5f7">1,284t</text>
  <text x="192" y="168" font-family="Arial, sans-serif" font-size="9" fill="#34d399">▲ 12.4%</text>

  <text x="346" y="128" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Energy Use</text>
  <text x="346" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#f5f5f7">847kWh</text>
  <text x="346" y="168" font-family="Arial, sans-serif" font-size="9" fill="#ff1f3d">▼ 6.1%</text>

  <text x="500" y="128" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Efficiency</text>
  <text x="500" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#f5f5f7">94.2%</text>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="9" fill="#34d399">▲ 3.8%</text>

  <text x="654" y="128" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Facilities</text>
  <text x="654" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#f5f5f7">37</text>
  <text x="654" y="168" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">online</text>

  <!-- main area chart -->
  <g filter="url(#eco-shadow)">
    <rect x="176" y="192" width="372" height="238" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
  </g>
  <text x="196" y="218" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#e5e5ea">Emissions Trend</text>
  <text x="196" y="234" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Last 12 months</text>
  <!-- gridlines -->
  <g stroke="#1c1c22" stroke-width="1">
    <line x1="196" y1="270" x2="528" y2="270"/>
    <line x1="196" y1="316" x2="528" y2="316"/>
    <line x1="196" y1="362" x2="528" y2="362"/>
  </g>
  <!-- emerald area -->
  <path d="M196 350 L230 340 L264 344 L298 320 L332 328 L366 300 L400 312 L434 288 L468 296 L502 274 L528 282 L528 408 L196 408 Z" fill="url(#eco-emerald)"/>
  <path d="M196 350 L230 340 L264 344 L298 320 L332 328 L366 300 L400 312 L434 288 L468 296 L502 274 L528 282" fill="none" stroke="#34d399" stroke-width="2"/>
  <!-- red area -->
  <path d="M196 372 L230 366 L264 374 L298 356 L332 362 L366 344 L400 352 L434 330 L468 340 L502 320 L528 330 L528 408 L196 408 Z" fill="url(#eco-area)"/>
  <path d="M196 372 L230 366 L264 374 L298 356 L332 362 L366 344 L400 352 L434 330 L468 340 L502 320 L528 330" fill="none" stroke="#ff1f3d" stroke-width="2"/>
  <circle cx="502" cy="320" r="4" fill="#ff1f3d" stroke="#0d0d10" stroke-width="2"/>

  <!-- donut card -->
  <g filter="url(#eco-shadow)">
    <rect x="562" y="192" width="220" height="238" rx="12" fill="url(#eco-panel)" stroke="#1f1f25"/>
  </g>
  <text x="582" y="218" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#e5e5ea">Source Mix</text>
  <g transform="translate(672,300)">
    <circle r="52" fill="none" stroke="#1c1c22" stroke-width="16"/>
    <circle r="52" fill="none" stroke="#ff1f3d" stroke-width="16" stroke-dasharray="130 327" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="52" fill="none" stroke="#34d399" stroke-width="16" stroke-dasharray="98 327" stroke-dashoffset="-130" transform="rotate(-90)"/>
    <circle r="52" fill="none" stroke="#fbbf24" stroke-width="16" stroke-dasharray="70 327" stroke-dashoffset="-228" transform="rotate(-90)"/>
    <text y="-2" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#f5f5f7" text-anchor="middle">68%</text>
    <text y="14" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74" text-anchor="middle">renewable</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" fill="#8a8a92">
    <rect x="582" y="392" width="8" height="8" rx="2" fill="#ff1f3d"/><text x="596" y="400">Solar</text>
    <rect x="642" y="392" width="8" height="8" rx="2" fill="#34d399"/><text x="656" y="400">Wind</text>
    <rect x="702" y="392" width="8" height="8" rx="2" fill="#fbbf24"/><text x="716" y="400">Grid</text>
  </g>
</svg>
