<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HealthConnect telemedicine app">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0a0c"/>
      <stop offset="1" stop-color="#050405"/>
    </linearGradient>
    <linearGradient id="hc-red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="hc-phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151518"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <linearGradient id="hc-video" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20222b"/>
      <stop offset="1" stop-color="#12131a"/>
    </linearGradient>
    <radialGradient id="hc-glow" cx="0.5" cy="0.4" r="0.6">
      <stop stop-color="#ff1f3d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hc-doc" cx="0.5" cy="0.35" r="0.7">
      <stop stop-color="#3a3f52"/>
      <stop offset="1" stop-color="#191b24"/>
    </radialGradient>
    <filter id="hc-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#hc-bg)"/>
  <circle cx="400" cy="210" r="300" fill="url(#hc-glow)"/>

  <!-- left context cards -->
  <g opacity="0.92">
    <rect x="66" y="120" width="184" height="76" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#hc-shadow)"/>
    <circle cx="94" cy="150" r="14" fill="#ff1f3d" fill-opacity="0.16"/>
    <path d="M87 150 h6 v-6 h2 v6 h6 v2 h-6 v6 h-2 v-6 h-6 z" fill="#ff1f3d"/>
    <text x="118" y="146" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Next appointment</text>
    <text x="118" y="162" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#f5f5f7">Today · 4:30 PM</text>
    <text x="118" y="178" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74">Dr. Sarah Chen · Cardiology</text>
  </g>
  <g opacity="0.92">
    <rect x="66" y="262" width="184" height="90" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#hc-shadow)"/>
    <text x="86" y="286" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Heart rate</text>
    <text x="86" y="310" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#f5f5f7">72 <tspan font-size="9" fill="#6b6b74">bpm</tspan></text>
    <path d="M86 336 h14 l6 -16 l8 30 l7 -22 l6 8 h49" fill="none" stroke="#ff1f3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right specialists list -->
  <g opacity="0.92">
    <rect x="552" y="120" width="184" height="210" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#hc-shadow)"/>
    <text x="572" y="146" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#f5f5f7">Available now</text>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="586" cy="176" r="13" fill="url(#hc-doc)"/><circle cx="596" cy="172" r="4" fill="#34d399"/>
    <text x="608" y="173" font-size="9" fill="#e5e5ea">Dr. James Okoro</text><text x="608" y="185" font-size="7.5" fill="#6b6b74">Dermatology</text>
    <circle cx="586" cy="216" r="13" fill="url(#hc-doc)"/><circle cx="596" cy="212" r="4" fill="#34d399"/>
    <text x="608" y="213" font-size="9" fill="#e5e5ea">Dr. Aisha Khan</text><text x="608" y="225" font-size="7.5" fill="#6b6b74">Pediatrics</text>
    <circle cx="586" cy="256" r="13" fill="url(#hc-doc)"/><circle cx="596" cy="252" r="4" fill="#fbbf24"/>
    <text x="608" y="253" font-size="9" fill="#e5e5ea">Dr. Marco Silva</text><text x="608" y="265" font-size="7.5" fill="#6b6b74">Neurology</text>
    <circle cx="586" cy="296" r="13" fill="url(#hc-doc)"/><circle cx="596" cy="292" r="4" fill="#34d399"/>
    <text x="608" y="293" font-size="9" fill="#e5e5ea">Dr. Lena Weber</text><text x="608" y="305" font-size="7.5" fill="#6b6b74">General</text>
  </g>

  <!-- phone with video call -->
  <g filter="url(#hc-shadow)">
    <rect x="316" y="40" width="188" height="380" rx="34" fill="url(#hc-phone)" stroke="#26262d" stroke-width="2"/>
  </g>
  <rect x="326" y="50" width="168" height="360" rx="26" fill="#0a0a0c"/>
  <rect x="382" y="60" width="56" height="10" rx="5" fill="#1a1a1f"/>

  <!-- video feed (doctor) -->
  <rect x="326" y="78" width="168" height="220" fill="url(#hc-video)"/>
  <!-- doctor silhouette -->
  <circle cx="410" cy="168" r="42" fill="url(#hc-doc)"/>
  <circle cx="410" cy="150" r="20" fill="#4a4f63"/>
  <path d="M376 214 q34 -46 68 0 Z" fill="#4a4f63"/>
  <!-- coat collar hint -->
  <path d="M392 200 l18 14 l18 -14" fill="none" stroke="#5a6076" stroke-width="3"/>
  <!-- live badge -->
  <rect x="338" y="90" width="52" height="18" rx="9" fill="#ff1f3d"/>
  <circle cx="350" cy="99" r="3" fill="#fff"/>
  <text x="360" y="103" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#fff">LIVE</text>
  <text x="430" y="103" font-family="Arial, sans-serif" font-size="8" fill="#c5c5cd">12:04</text>
  <!-- self preview -->
  <rect x="440" y="238" width="44" height="52" rx="8" fill="#0d0d10" stroke="#2a2a32"/>
  <circle cx="462" cy="256" r="9" fill="#3a3f52"/>
  <path d="M450 286 q12 -18 24 0 Z" fill="#3a3f52"/>
  <!-- doctor name -->
  <text x="338" y="285" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#fff">Dr. Sarah Chen</text>

  <!-- call controls -->
  <circle cx="356" cy="330" r="16" fill="#1a1a1f"/><path d="M350 330 h12 M356 324 v12" stroke="#c5c5cd" stroke-width="2" stroke-linecap="round" opacity="0"/>
  <path d="M350 326 a6 6 0 0 1 12 0 v6 a6 6 0 0 1 -12 0 z" fill="none" stroke="#c5c5cd" stroke-width="1.6"/>
  <circle cx="410" cy="332" r="20" fill="url(#hc-red)"/>
  <path d="M400 328 q10 8 20 0 l3 6 q-13 9 -26 0 z" fill="#fff"/>
  <circle cx="464" cy="330" r="16" fill="#1a1a1f"/>
  <rect x="457" y="324" width="14" height="10" rx="2" fill="none" stroke="#c5c5cd" stroke-width="1.6"/><path d="M471 327 l4 -3 v8 l-4 -3" fill="#c5c5cd"/>

  <!-- prescription row -->
  <rect x="338" y="360" width="144" height="40" rx="10" fill="#131317" stroke="#22222a"/>
  <rect x="348" y="370" width="20" height="20" rx="6" fill="#ff1f3d" fill-opacity="0.16"/>
  <path d="M354 380 h8 M358 376 v8" stroke="#ff1f3d" stroke-width="2" stroke-linecap="round"/>
  <text x="378" y="376" font-family="Arial, sans-serif" font-size="8.5" fill="#e5e5ea">e-Prescription ready</text>
  <text x="378" y="389" font-family="Arial, sans-serif" font-size="7.5" fill="#6b6b74">Tap to view · sent to pharmacy</text>
</svg>
