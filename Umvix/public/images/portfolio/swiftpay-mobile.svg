<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SwiftPay fintech mobile app">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0a0b"/>
      <stop offset="1" stop-color="#050405"/>
    </linearGradient>
    <linearGradient id="sp-red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="sp-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff2d4d"/>
      <stop offset="0.5" stop-color="#c40018"/>
      <stop offset="1" stop-color="#7a0010"/>
    </linearGradient>
    <linearGradient id="sp-phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151518"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="0.5" cy="0.4" r="0.6">
      <stop stop-color="#ff1f3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="sp-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="sp-cardshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ff1f3d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sp-bg)"/>
  <circle cx="400" cy="200" r="300" fill="url(#sp-glow)"/>

  <!-- floating side stats (context) -->
  <g opacity="0.9">
    <rect x="70" y="120" width="180" height="70" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#sp-shadow)"/>
    <circle cx="98" cy="150" r="14" fill="#34d399" fill-opacity="0.18"/>
    <path d="M92 150 l4 4 l8 -9" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="146" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Transfer complete</text>
    <text x="122" y="162" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#f5f5f7">+ $4,820.00</text>
    <text x="122" y="178" font-family="Arial, sans-serif" font-size="8" fill="#6b6b74">cross-border · 1.2s</text>
  </g>
  <g opacity="0.9">
    <rect x="70" y="260" width="180" height="64" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#sp-shadow)"/>
    <text x="90" y="284" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">FX rate · USD → EUR</text>
    <text x="90" y="306" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#f5f5f7">0.923</text>
    <text x="200" y="306" font-family="Arial, sans-serif" font-size="9" fill="#34d399">live</text>
    <circle cx="196" cy="284" r="3" fill="#34d399"/>
  </g>

  <g opacity="0.9">
    <rect x="552" y="150" width="180" height="150" rx="14" fill="#111114" stroke="#1f1f26" filter="url(#sp-shadow)"/>
    <text x="572" y="176" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Weekly volume</text>
    <g>
      <rect x="572" y="250" width="14" height="24" rx="3" fill="#2a2a30"/>
      <rect x="596" y="236" width="14" height="38" rx="3" fill="#2a2a30"/>
      <rect x="620" y="220" width="14" height="54" rx="3" fill="#ff1f3d"/>
      <rect x="644" y="242" width="14" height="32" rx="3" fill="#2a2a30"/>
      <rect x="668" y="210" width="14" height="64" rx="3" fill="#ff1f3d"/>
      <rect x="692" y="228" width="14" height="46" rx="3" fill="#2a2a30"/>
    </g>
    <text x="572" y="294" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#f5f5f7">$1.9M</text>
  </g>

  <!-- phone -->
  <g filter="url(#sp-shadow)">
    <rect x="316" y="40" width="188" height="380" rx="34" fill="url(#sp-phone)" stroke="#26262d" stroke-width="2"/>
  </g>
  <rect x="326" y="50" width="168" height="360" rx="26" fill="#0a0a0c"/>
  <rect x="382" y="60" width="56" height="10" rx="5" fill="#1a1a1f"/>

  <!-- app header -->
  <text x="346" y="98" font-family="Arial, sans-serif" font-size="9" fill="#6b6b74">Good morning</text>
  <text x="346" y="114" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#f5f5f7">Alex Rivera</text>
  <circle cx="472" cy="104" r="12" fill="#1a1a1f"/>
  <circle cx="472" cy="104" r="12" fill="none" stroke="#ff1f3d" stroke-opacity="0.5"/>

  <!-- payment card -->
  <g filter="url(#sp-cardshadow)">
    <rect x="346" y="128" width="132" height="86" rx="14" fill="url(#sp-card)"/>
  </g>
  <circle cx="452" cy="150" r="26" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="466" cy="196" r="34" fill="#ffffff" fill-opacity="0.08"/>
  <text x="360" y="150" font-family="Arial, sans-serif" font-size="8" fill="#ffe3e7">Balance</text>
  <text x="360" y="172" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#fff">$28,940</text>
  <text x="360" y="200" font-family="Arial, sans-serif" font-size="9" fill="#ffd0d6" letter-spacing="2">•••• 4291</text>
  <rect x="446" y="188" width="20" height="14" rx="3" fill="#ffffff" fill-opacity="0.5"/>

  <!-- action buttons -->
  <g>
    <rect x="346" y="228" width="40" height="40" rx="12" fill="url(#sp-red)"/>
    <path d="M366 240 v16 M358 248 h16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="392" y="228" width="40" height="40" rx="12" fill="#1a1a1f"/>
    <path d="M404 250 l8 -8 l8 8 M412 242 v14" stroke="#ff1f3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="438" y="228" width="40" height="40" rx="12" fill="#1a1a1f"/>
    <path d="M450 246 h16 M458 238 v16" stroke="#ff1f3d" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="7" fill="#8a8a92" text-anchor="middle">
    <text x="366" y="282">Send</text><text x="412" y="282">Top up</text><text x="458" y="282">Request</text>
  </g>

  <!-- transaction list -->
  <text x="346" y="304" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#e5e5ea">Recent</text>
  <g>
    <circle cx="356" cy="326" r="11" fill="#1a1a1f"/><text x="356" y="330" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#34d399" text-anchor="middle">S</text>
    <text x="376" y="323" font-family="Arial, sans-serif" font-size="9" fill="#e5e5ea">Spotify</text>
    <text x="376" y="335" font-family="Arial, sans-serif" font-size="7" fill="#6b6b74">Subscription</text>
    <text x="478" y="329" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#f5f5f7" text-anchor="end">-$9.99</text>
  </g>
  <g>
    <circle cx="356" cy="356" r="11" fill="#1a1a1f"/><text x="356" y="360" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#ff1f3d" text-anchor="middle">M</text>
    <text x="376" y="353" font-family="Arial, sans-serif" font-size="9" fill="#e5e5ea">Maria L.</text>
    <text x="376" y="365" font-family="Arial, sans-serif" font-size="7" fill="#6b6b74">Transfer · EUR</text>
    <text x="478" y="359" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#34d399" text-anchor="end">+$1,200</text>
  </g>
  <g>
    <circle cx="356" cy="386" r="11" fill="#1a1a1f"/><text x="356" y="390" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#fbbf24" text-anchor="middle">A</text>
    <text x="376" y="383" font-family="Arial, sans-serif" font-size="9" fill="#e5e5ea">Amazon</text>
    <text x="376" y="395" font-family="Arial, sans-serif" font-size="7" fill="#6b6b74">Shopping</text>
    <text x="478" y="389" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#f5f5f7" text-anchor="end">-$64.20</text>
  </g>
</svg>
